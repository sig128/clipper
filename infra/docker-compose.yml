# Clipforge local stack. CPU-only works out of the box; the optional GPU profile
# never breaks a machine without NVIDIA drivers (it is opt-in).
#
#   docker compose -f infra/docker-compose.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The media service runs inside the worker container (it needs ffmpeg + python).
  worker:
    build: { context: .., dockerfile: infra/worker.Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgres://clipforge:clipforge@postgres:5432/clipforge
      RENDER_CONCURRENCY: "2"
    volumes:
      - media:/data/media
    # GPU enhancement is opt-in and must not be required for a CPU-only install:
    # profiles: ["gpu"]  # uncomment on a host with NVIDIA drivers

volumes:
  pgdata:
  media:
